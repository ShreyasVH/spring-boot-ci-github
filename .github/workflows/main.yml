name: Conitnuous Integration

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run a one-line script
        run: echo Hello, World!

      - name: Run a custom script
        run: |
          ls -alh

      - name: Run git command
        run: git log -1

      - name: Check current Git branch
        run: git branch

      - name: Check Java version
        run: java -version

      - name: Check maven version
        run: mvn --version

      - name: Compute version
        id: ver
        run: |
          VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check docker version
        run: docker -v

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#      - name: Docker build
#        run: docker build . -t shreyasvh/spring-boot-ci-github
#
#      - name: Docker login
#        run: docker login -u ${{ secrets.dockerhubusername }} -p ${{ secrets.dockerhubpassword }}

      - name: Login to Docker Hub
        if: github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhubusername }}
          password: ${{ secrets.dockerhubpassword }}

      - name: Docker Build and push
        if: github.ref_name == 'main' || github.ref_name == '1-update-the-ci-steps-to-push-both-arm-and-amd-images'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            shreyasvh/spring-boot-ci-github:${{ steps.ver.outputs.version }}
#            shreyasvh/spring-boot-ci-github:latest
          platforms: linux/amd64,linux/arm64